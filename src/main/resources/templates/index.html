<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.com">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<style>
  #carouselBooks img {
  height: 300px;
  object-fit: cover;
}

@media (min-width: 768px) {
  #carouselBooks img {
    height: 400px;
  }
}

@media (min-width: 1200px) {
  #carouselBooks img {
    height: 500px;
  }
}

</style>
<body>
<div th:replace=" fragments :: header"></div>

<div class="container mt-4">
<div class="hero mb-5">
  <h1>Welcome to BookStore</h1>
  <p>Your gateway to endless knowledge and stories</p>
  <a href="/books" class="btn btn-light btn-lg mt-3">Browse Books</a>
</div>
<h2 class="mb-4">Featured Books</h2>
<div id="carouselBooks" class="carousel slide" data-bs-ride="carousel">
  <div id="carouselBooks" class="carousel slide" data-bs-ride="carousel">
  <!-- Indicators -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselBooks" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselBooks" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselBooks" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>

  <!-- Slides -->
  <div class="carousel-inner">
    <div th:each="book : ${books}">
    <div class="carousel-item active">
      <img th:src="${book.file}" class="d-block w-100" alt="Book 1">
    </div>
    <!-- <div class="carousel-item">
      <img src="img/book2.jpg" class="d-block w-100" alt="Book 2">
    </div>
    <div class="carousel-item">
      <img src="img/book3.jpg" class="d-block w-100" alt="Book 3"> -->
    </div>
  </div>

  <!-- Controls -->
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselBooks" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselBooks" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>

</div>
</div>

<div th:replace=" fragments :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
