<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.com">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div th:replace=" fragments :: header"></div>

<div class="container mt-4">
<div class="row">
  <div class="col-md-6"><img th:src="${book.file}" class="img-fluid" alt="Book"></div>
  <div class="col-md-6">
    <h2 th:text="${book.title}"></h2>
    <p class="text-muted"><B>By:</B> <span th:text="${book.author}"></span></p>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. This is a sample book description.</p>
    <h4> $<span th:text="${book.price}"></span></h4>
    
    <form th:action="@{/save/cart}" method="post">
        <input type="hidden" name="title" th:value="${book.title}">
        <input type="hidden" name="file" th:value="${book.file}">
        <input type="hidden" name="price" th:value="${book.price}">
       
        <button type="submit" class="btn btn-success">Add to Cart 🛒</button>
      </form>

  </div>
</div>
</div>

<div th:replace=" fragments :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
