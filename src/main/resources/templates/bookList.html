<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.com">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<body>

  <div th:replace=" fragments :: header"></div>

  <div class="container mt-4">
    <div class="row row-cols-1 row-cols-md-3 g-4">
      <div class="col" th:each="book : ${books}">
        <div class="card h-100 shadow-sm">
          <img th:src="${book.file}" class="card-img-top" alt="Book Cover">
          <div class="card-body">
            <h5 class="card-title" th:text="${book.title}">Book Title</h5>
            <p class="card-text text-muted mb-1" th:text="${book.user.username}">Author Name</p>
            <p class="fw-bold text-primary">$<span th:text="${#numbers.formatDecimal(book.price, 1, 2)}">$14.99</span>
            </p>
            <a th:href="@{book/{id}/detail(id=${book.id})}" class="btn btn-primary btn-sm">View Details</a>

            <form th:action="@{/book/{id}/delete(id=${book.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button type="submit" class="btn btn-danger btn-sm mt-2">Delete</button>
            </form>

          </div>
        </div>
      </div>
    </div>
