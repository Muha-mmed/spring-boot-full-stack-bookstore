<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.com">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>

  <div th:replace=" fragments :: header"></div>

  <div class="container mt-4">
    <h2>Your Cart</h2>
    <table class="table" >
      <thead>
        <tr>
          <th>Title</th>
          <th>Image</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="cart : ${carts}">
          <td th:text="${cart.title}"></td>
          <td><img th:src="${cart.file}" alt="cover" style="width:60px;"></td>
          <td th:text="${cart.price}"></td>
          <td><form th:href="@{/cart/delete/{id}(id=${cart.id})}" method="post">
      <button type="submit" class="btn btn-danger">Delete</button>
    </form> </td>
        </tr>
      </tbody>
    </table>
    <div class="text-end">
      <h4>Grand Total: $49.97</h4><a href="checkout" class="btn btn-primary">Proceed to Checkout</a>
    </div>
  
  </div>

  <div th:replace=" fragments :: footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
