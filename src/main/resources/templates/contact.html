<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.com">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div th:replace=" fragments :: header"></div>

<div class="container mt-4"><h2>Contact Us</h2><form><input class='form-control mb-2' placeholder='Your Name'><input class='form-control mb-2' placeholder='Email'><textarea class='form-control mb-2' placeholder='Message'></textarea><button class='btn btn-primary'>Send</button></form></div>

<div th:replace=" fragments :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
