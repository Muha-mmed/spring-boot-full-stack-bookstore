<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.com">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Book</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <!-- Navbar -->
  <div th:replace=" fragments :: header"></div>

  <!-- Main content -->
  <div class="container mt-5">
    <h2 class="mb-4">Add a New Book</h2>
    <form th:action="@{/save}" th:object="${book}" method="post">
      <div class="mb-3">
        <label class="form-label">Book Title</label>
        <input type="text" th:field="*{title}" name="title" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Author</label>
        <input type="text" th:field="*{author}" name="author" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Price ($)</label>
        <input type="number" step="0.01" th:field="*{price}" name="price" class="form-control" placeholder="10.0" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Book Cover (Image URL)</label>
        <input type="text" th:field="*{file}" class="form-control" name="file" placeholder="http://example.com/cover.jpg">
      </div>

      <button type="submit" class="btn btn-success">Save Book</button>
      <a th:href="@{/books}" class="btn btn-secondary">Cancel</a>
    </form>

  </div>

  <!-- Footer -->
  <div th:replace=" fragments :: footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
